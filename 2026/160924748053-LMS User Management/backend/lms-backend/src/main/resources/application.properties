# ================= Server =================
server.port=8080

# ================= MySQL Database =================
# Set DB_PASSWORD and JWT_SECRET as environment variables
spring.datasource.url=jdbc:mysql://localhost:3306/sampledbz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / Hibernate =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================= JWT =================
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string}
jwt.expiration-ms=86400000

# ================= CORS =================
app.cors.allowed-origins=http://localhost:3000,http://192.168.137.1:3000
# ================= Admin Registration =================
# Anyone registering with role=ADMIN in the UI must enter this code.
# Change it to your own secret before deploying.
app.admin-registration-code=${ADMIN_CODE:change-me}
